[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlvideo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyMySQL[rsa]>=1.1", "jsonschema>=4.23", "psutil>=6", "yt-dlp==2026.8.19", "yt-dlp-ejs==0.8.0", "Pillow==12.1.1", "fonttools==4.61.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
