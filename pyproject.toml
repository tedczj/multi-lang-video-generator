[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlvideo"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["PyMySQL[rsa]>=1.1", "jsonschema>=4.23", "psutil>=6", "yt-dlp==2026.8.19", "yt-dlp-ejs==0.8.0", "Pillow==12.1.1", "fonttools==4.61.1"]

[project.optional-dependencies]
test = ["pytest>=8"]
studio = ["fastapi>=0.128.2,<1", "uvicorn>=0.48,<1"]
studio-test = ["httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"mlvideo.studio" = ["static/*.html", "static/*.css", "static/*.js"]
